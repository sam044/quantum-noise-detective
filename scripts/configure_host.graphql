mutation ConfigureHost($service: String!, $environment: String!) {
  serviceInstanceUpdate(serviceId: $service, environmentId: $environment, input: {
    healthcheckPath: "/_stcore/health", healthcheckTimeout: 180,
    restartPolicyType: ON_FAILURE, restartPolicyMaxRetries: 10,
    numReplicas: 1, sleepApplication: false, drainingSeconds: 30
  })
  serviceInstanceLimitsUpdate(input: {
    serviceId: $service, environmentId: $environment, memoryGB: 1, vCPUs: 1
  })
}
